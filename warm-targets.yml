# Linux CMake presets warmed into the compile-cache seed.
#
# Sanitizer and release/debug presets are warmed. Coverage presets are not:
# pace-cc binds coverage-map objects to the checkout root, so they never hit
# from another checkout, and pace/morph refuse to configure coverage with a
# compiler launcher. Windows presets (cl-*, clangcl-*, windows-everything) are
# excluded because this image is Linux-only.
#
# Each (project, preset) pair gets its own seed namespace. Release presets run
# ctest in the warm-up; sanitizer and debug presets build only.
projects:
  - repo: LASTRADA-Software/pace
    presets:
      - gcc-debug
      - gcc-release
      - gate-gcc-release
      - clang-debug
      - clang-release
      - gate-clang-debug
      - clang-tracy
      - clang-asan-ubsan
      - clang-tsan

  - repo: LASTRADA-Software/morph
    presets:
      - gcc-debug
      - gcc-release
      - clang-debug
      - clang-release
      - linux-everything
      - clang-asan
      - clang-tsan
      - clang-ubsan

  - repo: LASTRADA-Software/Lightweight
    presets:
      - gcc-debug
      - gcc-release
      - clang-debug
      - clang-release
      - clang-asan-ubsan
      - clang-tsan

  - repo: LASTRADA-Software/formula-cpp
    presets:
      - gcc-release
      - clang-debug
      - clang-release
      - clang-ubsan
