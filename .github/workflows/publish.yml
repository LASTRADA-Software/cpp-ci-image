name: Publish

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/lastrada-software/cpp-ci
  SEED_IMAGE_PREFIX: ghcr.io/lastrada-software/cpp-ci-seed-pace

jobs:
  # Resolve immutable inputs and the warm-up groups. Pull requests build and
  # smoke-test only; every other event also warms the caches and publishes.
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      base_image: ${{ steps.inputs.outputs.base_image }}
      pace_ref: ${{ steps.inputs.outputs.pace_ref }}
      publish: ${{ steps.inputs.outputs.publish }}
      groups: ${{ steps.inputs.outputs.groups }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: inputs
        shell: bash
        run: |
          set -euo pipefail
          # Parse the plain-text output: the --format templates differ between buildx versions.
          # Retry, and show the registry's error on failure rather than hiding it.
          base_digest=""
          for attempt in 1 2 3; do
            if out="$(docker buildx imagetools inspect ubuntu:24.04 2>&1)"; then
              base_digest="$(printf '%s\n' "$out" | awk '/^Digest:/{print $2; exit}')"
              [ -n "$base_digest" ] && break
            fi
            echo "attempt $attempt failed:"; printf '%s\n' "$out"; sleep 15
          done
          test -n "$base_digest"
          pace_ref="$(git ls-remote https://github.com/LASTRADA-Software/pace.git refs/heads/master | awk '{print $1}')"
          test -n "$pace_ref"
          groups="$(jq -c '[.projects[] | select(.name=="pace") | .groups[].name]' warm-targets.json)"
          {
            echo "base_image=ubuntu:24.04@${base_digest}"
            echo "pace_ref=${pace_ref}"
            echo "groups=${groups}"
            if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
              echo "publish=false"
            else
              echo "publish=true"
            fi
          } >> "$GITHUB_OUTPUT"
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

  # Build the toolchain image without any seed, smoke-test it, and push it under
  # its <sha>-base tag so the warm-up can run in exactly this image.
  build:
    needs: resolve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          build-contexts: |
            pace-seed=./seed/none
          build-args: |
            BASE_IMAGE=${{ needs.resolve.outputs.base_image }}
            PACE_REF=${{ needs.resolve.outputs.pace_ref }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}-base
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.lastrada.pace.ref=${{ needs.resolve.outputs.pace_ref }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      - name: Smoke test toolchain
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "${IMAGE}:${GITHUB_SHA}-base" bash -euo pipefail -c '
            for tool in gcc g++ gcc-14 g++-14 clang clang++ clang-tidy \
                        clang-22 clang++-22 clang-tidy-22 llvm-symbolizer cmake ninja \
                        pkg-config pace-cc pace-kv; do
              command -v "$tool" >/dev/null || { echo "missing: $tool"; exit 1; }
            done
            gcc --version | head -n1
            clang++ --version | head -n1
            cmake --version | head -n1
            ninja --version
            for bin in /opt/pace/bin/pace-cc /opt/pace/bin/pace-kv; do
              if ldd "$bin" | grep -q "not found"; then
                echo "unresolved libraries in $bin"; ldd "$bin"; exit 1
              fi
            done
            test -d "$PACE_CACHE_SEED_DIR"
            tmp="$(mktemp -d)"
            printf "#include <cstdio>\nint main(){std::puts(\"ok\");}\n" > "$tmp/t.cpp"
            g++ -std=c++23 -o "$tmp/gcc-t" "$tmp/t.cpp"
            clang++ -std=c++23 -stdlib=libstdc++ -o "$tmp/clang-t" "$tmp/t.cpp"
            "$tmp/gcc-t" && "$tmp/clang-t"
          '

      - uses: docker/login-action@v3
        if: needs.resolve.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push base image
        if: needs.resolve.outputs.publish == 'true'
        shell: bash
        run: docker push "${IMAGE}:${GITHUB_SHA}-base"

  # Warm one group of pace's presets. The groups run in parallel, each into its own
  # store. Each job starts from the previous published seed for its group, so only
  # translation units whose inputs changed are recompiled. Any failing build fails
  # its group, and no candidate seed is pushed for it.
  warm:
    needs: [resolve, build]
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ${{ vars.WARM_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 330
    strategy:
      fail-fast: true
      matrix:
        group: ${{ fromJSON(needs.resolve.outputs.groups) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: cpp-ci-image

      # The project checkout sits at the same path inside the container as on the
      # host, so the cache keys see the same layout as the warm-up.
      - uses: actions/checkout@v4
        with:
          repository: LASTRADA-Software/pace
          ref: ${{ needs.resolve.outputs.pace_ref }}
          path: pace-src
          # Full history, as pace's CI checks out: the version comes from
          # `git describe`, and pace-cc, pace-node and pacectl compile it in as
          # a definition. A shallow clone falls back to a default version, so
          # those units were warmed under keys CI never asks for (64 of 1279
          # gcc-release units missed from a full-depth checkout).
          fetch-depth: 0

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image
        shell: bash
        run: docker pull "${IMAGE}:${GITHUB_SHA}-base"

      # pace's configure downloads the CPM bootstrap from a GitHub release asset,
      # and that endpoint returns 5xx often enough to fail whole groups. Fetch it
      # here instead, into the CPM source cache that is mounted at pace's default
      # location in the container; CMake skips its own download when the file is
      # already present with the expected hash. If the release asset stays
      # unavailable, rebuild it from the git tag the way CPM's release workflow
      # does (substitute the version). pace's pinned hash is checked either way.
      - name: Prefetch CPM bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cpm="pace-src/cmake/CPM.cmake"
          version="$(sed -n 's/^set(CPM_DOWNLOAD_VERSION \([^)]*\))/\1/p' "$cpm")"
          hash="$(sed -n 's/^set(CPM_HASH_SUM "\([0-9a-f]*\)")/\1/p' "$cpm")"
          test -n "$version" && test -n "$hash"
          dest="$RUNNER_TEMP/warm/cpm/cpm/CPM_${version}.cmake"
          mkdir -p "$(dirname "$dest")"
          verify() { echo "${hash}  ${dest}" | sha256sum -c --status -; }
          if curl -fsSL --retry 4 --retry-all-errors --retry-delay 10 --retry-max-time 180 \
               -o "$dest" \
               "https://github.com/cpm-cmake/CPM.cmake/releases/download/v${version}/CPM.cmake" \
             && verify; then
            echo "CPM ${version} bootstrap fetched from the release asset"
          else
            echo "::warning::CPM release asset unavailable; rebuilding it from tag v${version}"
            src="$RUNNER_TEMP/cpm-src"
            rm -rf "$src"
            for attempt in 1 2 3; do
              git -c advice.detachedHead=false clone --quiet --depth 1 --branch "v${version}" \
                https://github.com/cpm-cmake/CPM.cmake.git "$src" && break
              rm -rf "$src"; sleep $((attempt * 15))
            done
            sed "s/1\.0\.0-development-version/${version}/g" "$src/cmake/CPM.cmake" > "$dest"
            verify || { echo "::error::rebuilt CPM bootstrap does not match pace's hash"; exit 1; }
          fi

      - name: Fetch previous seed for this group
        id: previous
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/warm"
          mkdir -p "$work"
          prev="${SEED_IMAGE_PREFIX}-${GROUP}:latest"
          if docker pull "$prev" >/dev/null 2>&1; then
            cid="$(docker create "$prev" /cache-copy)"
            docker cp "$cid:/cache.cow" "$work/previous.cow"
            docker rm "$cid" >/dev/null
            echo "found previous seed: $(stat -c %s "$work/previous.cow") bytes"
            echo "seed=$work/previous.cow" >> "$GITHUB_OUTPUT"
          else
            echo "no previous seed for $GROUP; starting empty"
            echo "seed=" >> "$GITHUB_OUTPUT"
          fi

      - name: Warm pace group
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
          SEED: ${{ steps.previous.outputs.seed }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/warm"
          src="$GITHUB_WORKSPACE/pace-src"
          manifest="cpp-ci-image/warm-targets.json"
          jq -r --arg g "$GROUP" '.projects[] | select(.name=="pace") | .groups[] | select(.name==$g)
              | .presets[] | [.name, (.configure_args | join(" "))] | @tsv' "$manifest" > "$work/presets.tsv"
          cat "$work/presets.tsv"
          seed_args=()
          if [ -n "$SEED" ]; then
            cp "$SEED" "$work/seed-in.cow"
            seed_args=(-e SEED_STORE=/warm/seed-in.cow)
          fi
          mkdir -p "$work/out"
          docker run --rm \
            -v "$src:$src" \
            -v "$work:/warm" \
            -v "$work/cpm:/root/.cache/pace/cpm" \
            -v "$GITHUB_WORKSPACE/cpp-ci-image/scripts:/scripts:ro" \
            -e WORKSPACE="$src" \
            -e STORE=/warm/out/cache.cow \
            -e PRESETS_FILE=/warm/presets.tsv \
            -e WARM_MAX_DISK="${WARM_MAX_DISK:-4g}" \
            "${seed_args[@]}" \
            -w "$src" \
            "${IMAGE}:${GITHUB_SHA}-base" \
            bash /scripts/warm-project.sh
          ls -l "$work/out/cache.cow"

      # When every compile hit, the store comes out byte-identical to the previous
      # seed. Re-tag the previous seed image instead of building a new one, so its
      # layer digest stays the same and nothing is uploaded again downstream.
      - name: Push candidate seed for this group
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
          SEED: ${{ steps.previous.outputs.seed }}
        run: |
          set -euo pipefail
          img="${SEED_IMAGE_PREFIX}-${GROUP}"
          out="$RUNNER_TEMP/warm/out/cache.cow"
          if [ -n "$SEED" ] && cmp -s "$SEED" "$out"; then
            echo "store unchanged; re-tagging the previous seed"
            docker tag "${img}:latest" "${img}:${GITHUB_SHA}"
          else
            ctx="$RUNNER_TEMP/seed-ctx-$GROUP"
            mkdir -p "$ctx"
            cp "$out" "$ctx/cache.cow"
            printf 'FROM scratch\nCOPY cache.cow /cache.cow\n' > "$ctx/Dockerfile"
            docker build -t "${img}:${GITHUB_SHA}" "$ctx"
          fi
          docker push "${img}:${GITHUB_SHA}"

  # Layer the group seeds on top of the <sha>-base image, smoke-test them with that
  # image's pace-kv, and push. Runs only after every warm-up group succeeded, so a
  # failed group keeps the previous image, with its previous seeds, as `latest`.
  #
  # The base layers are already in the registry, and each group is its own layer,
  # so a push uploads only the groups whose store changed. buildkit pushes straight
  # to the registry: a layer the registry already holds is neither downloaded from
  # the build cache nor uploaded again.
  publish:
    needs: [resolve, warm]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble seed context from candidate group seeds
        shell: bash
        env:
          GROUPS: ${{ needs.resolve.outputs.groups }}
        run: |
          set -euo pipefail
          ctx="$RUNNER_TEMP/seed-ctx"
          mkdir -p "$ctx/pace"
          {
            echo 'ARG BASE'
            echo 'FROM ${BASE}'
          } > "$ctx/Dockerfile"
          for group in $(jq -r '.[]' <<<"$GROUPS"); do
            img="${SEED_IMAGE_PREFIX}-${group}:${GITHUB_SHA}"
            docker pull "$img"
            cid="$(docker create "$img" /cache-copy)"
            docker cp "$cid:/cache.cow" "$ctx/pace/${group}.cow"
            docker rm "$cid" >/dev/null
            docker rmi "$img" >/dev/null
            echo "COPY pace/${group}.cow /opt/pace/seed-cache/pace/${group}.cow" >> "$ctx/Dockerfile"
          done
          ls -l "$ctx/pace"
          cat "$ctx/Dockerfile"

      # Each seed must open with the pace-kv it ships beside, which is the base
      # image's. Open a copy, so the shipped store is not modified.
      - name: Smoke test seeds
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$RUNNER_TEMP/seed-ctx/pace:/seeds:ro" "${IMAGE}:${GITHUB_SHA}-base" \
            bash -euo pipefail -c '
            shopt -s nullglob
            stores=(/seeds/*.cow)
            test "${#stores[@]}" -gt 0
            for store in "${stores[@]}"; do
              cp "$store" /tmp/seed-check.cow
              port=6675
              pace-kv --bind=127.0.0.1 --port=$port --storage=/tmp/seed-check.cow \
                  --storage-shards=1 --log-level=warn &
              KV=$!
              for _ in $(seq 100); do
                if (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; then break; fi
                sleep 0.2
              done
              kill -0 "$KV" || { echo "seed $store did not open"; exit 1; }
              kill -TERM "$KV"; wait "$KV" || true
              rm -f /tmp/seed-check.cow
            done
          '

      - uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/seed-ctx
          push: true
          provenance: false
          build-args: |
            BASE=${{ env.IMAGE }}:${{ github.sha }}-base
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # Cache metadata travels inline in the pushed image, and the previous
          # `latest` is the cache source: every layer it could reuse is already in
          # the registry, so nothing is exported twice. A GitHub Actions cache here
          # spent 13 minutes uploading the seed layers a second time (run
          # 42657909119) for a cache the registry already is.
          cache-from: type=registry,ref=${{ env.IMAGE }}:latest
          cache-to: type=inline

      # Promote on master only: the published group seeds become the starting
      # point for the next warm-up. Branch runs never move `latest`.
      - name: Promote seeds and image to latest
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GROUPS: ${{ needs.resolve.outputs.groups }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${GITHUB_SHA}"
          for group in $(jq -r '.[]' <<<"$GROUPS"); do
            docker buildx imagetools create \
              --tag "${SEED_IMAGE_PREFIX}-${group}:latest" \
              "${SEED_IMAGE_PREFIX}-${group}:${GITHUB_SHA}"
          done
